version: '3.8'

services:
  # 開発環境 - インタラクティブな開発用
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicar-dev
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./models:/app/models
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY}
    network_mode: host
    command: /bin/bash

  # トレーニング環境 - 学習実行用
  train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicar-train
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./models:/app/models
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: python scripts/train.py --config configs/training_config.yaml

  # Jupyter Notebook環境
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicar-jupyter
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./models:/app/models
    working_dir: /app
    ports:
      - "8888:8888"
    environment:
      - PYTHONUNBUFFERED=1
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  # TensorBoard - 学習過程の可視化
  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicar-tensorboard
    volumes:
      - ./logs/tensorboard:/app/logs/tensorboard
    working_dir: /app
    ports:
      - "6006:6006"
    command: tensorboard --logdir=/app/logs/tensorboard --host=0.0.0.0 --port=6006

# ボリューム定義（オプション）
volumes:
  logs:
  models:
