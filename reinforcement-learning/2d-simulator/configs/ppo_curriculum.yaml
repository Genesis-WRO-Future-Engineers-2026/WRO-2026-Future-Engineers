# カリキュラム学習用PPO設定

# 環境設定（カリキュラム使用時は無視される）
env:
  course: "courses/easy/simple_oval.json"  # 初期コース（カリキュラムで上書きされる）
  max_steps: 2000

# カリキュラム学習設定（本番コース用 + Domain Randomization）
curriculum:
  enabled: true
  courses:
    - "courses/easy/simple_oval.json"                  # Level 0: 基本走行スキル獲得
    - "courses/real/real-course_course.json"           # Level 1: 本番コース（ベース）
    - "courses/real/variations/real_course_var1.json"  # Level 2-6: バリエーション（ランダム選択）
    - "courses/real/variations/real_course_var2.json"  #   - var1: 小ノイズ(±3cm)
    - "courses/real/variations/real_course_var3.json"  #   - var2: 中ノイズ(±5cm)
    - "courses/real/variations/real_course_var4.json"  #   - var3: 大ノイズ(±8cm)
    - "courses/real/variations/real_course_var5.json"  #   - var4: 壁幅1.05倍拡大
                                                        #   - var5: 壁幅0.95倍縮小
  success_threshold: 0.75          # レベルアップに必要な成功率
  degradation_threshold: 0.25      # レベルダウンする成功率
  evaluation_window: 100           # 成功率を計算する直近エピソード数
  min_episodes_before_advance: 50  # レベルアップ判定の最小エピソード数
  allow_degradation: true          # 難易度を下げることを許可
  randomize_from_level: 2          # Level 2以降でランダムにバリエーションを選択

# 学習設定
training:
  total_iterations: 2000   # カリキュラム学習では長めに設定
  n_steps: 2048           # ステップ数/イテレーション
  n_epochs: 10            # エポック数/更新
  batch_size: 64

# PPOパラメータ
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99           # 割引率
  gae_lambda: 0.95      # GAEのλ
  clip_range: 0.2       # クリッピング範囲
  entropy_coef: 0.03    # エントロピー係数
  value_coef: 0.5       # 価値関数係数
  max_grad_norm: 0.5    # 勾配クリッピング

# ネットワーク設定
network:
  hidden_dims: [256, 256]
  use_shared_network: false

# チェックポイント
checkpoint:
  save_freq: 100         # カリキュラム学習では頻度を上げる
  checkpoint_dir: "models/checkpoints_curriculum"

# 評価
evaluation:
  eval_freq: 50
  n_eval_episodes: 5

# ロギング
logging:
  log_dir: "logs"
  use_tensorboard: true
  use_csv: true

# その他
seed: 42
device: "auto"  # cpu, cuda, mps, or auto
