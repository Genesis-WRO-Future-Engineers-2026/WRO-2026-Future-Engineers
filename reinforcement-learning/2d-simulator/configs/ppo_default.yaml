# PPO学習のデフォルト設定

# 環境設定
env:
  course: "courses/curriculum/level2_simple_oval.json"
  max_steps: 2000

# 学習設定
training:
  total_iterations: 1000
  n_steps: 2048  # ステップ数/イテレーション
  n_epochs: 10   # エポック数/更新
  batch_size: 64

# PPOパラメータ
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99           # 割引率
  gae_lambda: 0.95      # GAEのλ
  clip_range: 0.2       # クリッピング範囲
  entropy_coef: 0.01    # エントロピー係数
  value_coef: 0.5       # 価値関数係数
  max_grad_norm: 0.5    # 勾配クリッピング

# ネットワーク設定
network:
  hidden_dims: [256, 256]
  use_shared_network: false

# チェックポイント
checkpoint:
  save_freq: 50
  checkpoint_dir: "models/checkpoints"

# 評価
evaluation:
  eval_freq: 50
  n_eval_episodes: 5

# ロギング
logging:
  log_dir: "logs"
  use_tensorboard: true
  use_csv: true

# その他
seed: 42
device: "auto"  # cpu, cuda, mps, or auto
